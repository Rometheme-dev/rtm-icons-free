        .stat { background: #e8f5e9; padding: 10px 20px; border-radius: 6px; font-weight: 600; color: #2e7d32; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .tab { padding: 10px 20px; background: none; border: none; cursor: pointer; font-size: 14px; font-weight: 500; color: #666; border-radius: 6px 6px 0 0; transition: all 0.2s; }
        .tab:hover { background: #f5f5f5; }
        .tab.active { background: #fff; color: #333; border-bottom: 2px solid #2196f3; margin-bottom: -2px; }
        .tab-panel { display: none; }

        .search-box { width: 100%; max-width: 400px; padding: 10px 16px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 20px; }

        function createIconElement(name, style) {
            const div = document.createElement('div');
            div.className = 'icon-item';
            div.dataset.name = name.toLowerCase();
            const i = document.createElement('i');
            i.className = style === 'thin' ? `rtmicon-thin rtmicon-${name}` : `rtmicon rtmicon-${name}`;
            const nameSpan = document.createElement('span');
            nameSpan.className = 'icon-name';
            nameSpan.textContent = name;
            div.appendChild(i);
            div.appendChild(nameSpan);
            
            // Add click event to copy class name
            div.addEventListener('click', (e) => {
                e.stopPropagation(); // Prevent tab switching
                const className = i.className;
                navigator.clipboard.writeText(className).then(() => {
                    showCopiedNotification(div);
                });
            });
            
            return div;
        }
        function showCopiedNotification(element) {
            // Create notification element
            const notification = document.createElement('div');
            notification.textContent = 'Copied!';
            notification.style.cssText = `
                position: absolute;
                background: #4caf50;
                color: white;
                padding: 4px 8px;
                border-radius: 4px;
                font-size: 12px;
                font-weight: 600;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.3s;
                z-index: 1000;
            `;
            element.style.position = 'relative';
            element.appendChild(notification);
            
            // Show notification
            setTimeout(() => {
                notification.style.opacity = '1';
                notification.style.top = '-30px';
                notification.style.left = '50%';
                notification.style.transform = 'translateX(-50%)';
            }, 10);
            
            // Hide and remove notification
            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 300);
            }, 1500);
        }
        
        function renderIcons(icons, containerId, style) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            icons.forEach(name => container.appendChild(createIconElement(name, style)));
        }
        function filterIcons(searchTerm) {
            const term = searchTerm.toLowerCase();
            document.querySelectorAll('.icon-item').forEach(item => {
                item.classList.toggle('hidden', !item.dataset.name.includes(term));
            });
        }
        document.addEventListener('DOMContentLoaded', () => {
            renderIcons(regularIcons, 'grid-regular', 'regular');
            renderIcons(thinIcons, 'grid-thin', 'thin');
            renderIcons([...regularIcons, ...thinIcons], 'grid-all', 'regular');
            document.getElementById('count-regular').textContent = regularIcons.length;
            document.getElementById('count-thin').textContent = thinIcons.length;
            document.getElementById('count-total').textContent = regularIcons.length + thinIcons.length;
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
                });
            });
            document.getElementById('searchBox').addEventListener('input', (e) => filterIcons(e.target.value));
        });
